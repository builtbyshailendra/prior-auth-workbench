apiVersion: v1
kind: Service
metadata:
  name: workflow
spec:
  selector:
    app: workflow
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # A release that isn't ready within 90 seconds is marked as failed.
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # Never remove a working pod before its replacement is ready.
      maxUnavailable: 0
  selector:
    matchLabels:
      app: workflow
  template:
    metadata:
      labels:
        app: workflow
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for PostgreSQL instead of crash-looping while it starts on a fresh cluster.
        - name: wait-for-database
          image: priorauth-workflow
          command:
            - python
            - -c
            - |
              import os, time
              from sqlalchemy import create_engine, text
              engine = create_engine(os.environ["DATABASE_URL"], connect_args={"connect_timeout": 3})
              for _ in range(60):
                  try:
                      with engine.connect() as connection:
                          connection.execute(text("SELECT 1"))
                      break
                  except Exception as error:
                      print("Waiting for the database:", type(error).__name__, flush=True)
                      time.sleep(2)
              else:
                  raise SystemExit("The database wasn't reachable within two minutes")
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: priorauth-secrets, key: database-url}
          securityContext: &locked-down
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: workflow
          image: priorauth-workflow
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: priorauth-secrets, key: database-url}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: {name: priorauth-secrets, key: session-secret}
            - name: CONNECTOR_TOKEN
              valueFrom:
                secretKeyRef: {name: priorauth-secrets, key: connector-token}
            - name: EXTRACTOR_TOKEN
              valueFrom:
                secretKeyRef: {name: priorauth-secrets, key: extractor-token}
            # Demo staff accounts for this synthetic system; the password is generated per cluster.
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef: {name: priorauth-secrets, key: demo-password}
            - name: APP_ENV
              value: production
            - name: EXTRACTION_MODE
              value: worker
            - name: EXTRACTION_TIMEOUT_MINUTES
              value: "1"
          # Startup: up to 60 seconds to create the tables and start listening.
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # Liveness: no database check, so a database outage doesn't restart every pod.
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: only send traffic while it can reach the database.
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests: {cpu: 50m, memory: 160Mi}
            limits: {memory: 320Mi}
          securityContext: *locked-down
