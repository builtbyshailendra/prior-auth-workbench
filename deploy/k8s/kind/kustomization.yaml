# The base, plus what a local kind cluster needs:
# - the web app on a fixed NodePort that deploy/kind/cluster.yaml maps to http://127.0.0.1:8080
# - plain-HTTP cookies, because that address has no TLS (keep COOKIE_SECURE=1 anywhere real)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: Service
      name: web
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Deployment
      name: workflow
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: COOKIE_SECURE
          value: "0"
